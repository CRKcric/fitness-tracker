databases:
  - name: fitness-tracker-db
    databaseName: fitness_tracker
    user: fitness_tracker_user

services:
  - type: web
    name: fitness-tracker
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    releaseCommand: "python manage.py migrate"
    startCommand: "gunicorn fitness_tracker.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "fitness-tracker-ppe4.onrender.com,*.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://fitness-tracker-ppe4.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: USE_X_FORWARDED_HOST
        value: "True"
